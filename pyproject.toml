[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-rl"
version = "0.1.0"
description = "A PyTorch Q-learning agent for the Snake game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pygame>=2.5", "torch>=2.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
snake-rl = "snake_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test_game.py", "test_cli.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
